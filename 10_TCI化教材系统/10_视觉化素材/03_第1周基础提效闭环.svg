<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">第 1 周基础提效闭环</title>
  <desc id="desc">展示第 1 周从边界清单到个人 AI 基础提效包的闭环。</desc>
  <defs><style>.bg{fill:#f7fafc}.node{fill:#fff;stroke:#d8e1e8;stroke-width:2}.h{font:700 28px "Microsoft YaHei",Arial;fill:#17212b}.t{font:700 16px "Microsoft YaHei",Arial;fill:#1f2933}.s{font:400 13px "Microsoft YaHei",Arial;fill:#5f6f7f}.arrow{stroke:#6b7b8c;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7b8c"/></marker></defs>
  <rect class="bg" width="1080" height="420" rx="18"/>
  <text class="h" x="540" y="54" text-anchor="middle">第 1 周：个人基础提效闭环</text>
  <g transform="translate(50 140)">
    <rect class="node" width="140" height="90" rx="12"/><text class="t" x="70" y="36" text-anchor="middle">边界清单</text><text class="s" x="70" y="62" text-anchor="middle">先分清能不能用</text>
    <path class="arrow" d="M150 45 H210"/>
    <g transform="translate(220 0)"><rect class="node" width="140" height="90" rx="12"/><text class="t" x="70" y="36" text-anchor="middle">提示词模板</text><text class="s" x="70" y="62" text-anchor="middle">把任务说清楚</text></g>
    <path class="arrow" d="M370 45 H430"/>
    <g transform="translate(440 0)"><rect class="node" width="140" height="90" rx="12"/><text class="t" x="70" y="36" text-anchor="middle">产品理解卡</text><text class="s" x="70" y="62" text-anchor="middle">事实和卖点对齐</text></g>
    <path class="arrow" d="M590 45 H650"/>
    <g transform="translate(660 0)"><rect class="node" width="140" height="90" rx="12"/><text class="t" x="70" y="36" text-anchor="middle">评论分析表</text><text class="s" x="70" y="62" text-anchor="middle">保留用户证据</text></g>
    <path class="arrow" d="M810 45 H870"/>
    <g transform="translate(880 0)"><rect class="node" width="140" height="90" rx="12"/><text class="t" x="70" y="36" text-anchor="middle">Listing v1/v2</text><text class="s" x="70" y="62" text-anchor="middle">生成后人工修改</text></g>
  </g>
  <rect x="310" y="295" width="460" height="56" rx="28" fill="#e7f1fa"/>
  <text class="t" x="540" y="318" text-anchor="middle">最终留下：个人 AI 基础提效包</text>
  <text class="s" x="540" y="340" text-anchor="middle">不是聊天记录，而是一组下次还能继续用的文件</text>
</svg>
